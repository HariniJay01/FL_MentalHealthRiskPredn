server {
    listen 80;
    server_name localhost;

    # Serve static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to FL Server
    location /api/server/ {
        proxy_pass         http://fl-server:5000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        add_header         Access-Control-Allow-Origin *;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header         Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # Proxy to each Client Node
    location /api/client/twitter/ {
        proxy_pass         http://fl-client-twitter:5000/;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
        add_header         Access-Control-Allow-Origin *;
        if ($request_method = OPTIONS) { return 204; }
    }
    location /api/client/reddit/ {
        proxy_pass         http://fl-client-reddit:5000/;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
        add_header         Access-Control-Allow-Origin *;
        if ($request_method = OPTIONS) { return 204; }
    }
    location /api/client/facebook/ {
        proxy_pass         http://fl-client-facebook:5000/;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
        add_header         Access-Control-Allow-Origin *;
        if ($request_method = OPTIONS) { return 204; }
    }
    location /api/client/instagram/ {
        proxy_pass         http://fl-client-instagram:5000/;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
        add_header         Access-Control-Allow-Origin *;
        if ($request_method = OPTIONS) { return 204; }
    }
    location /api/client/linkedin/ {
        proxy_pass         http://fl-client-linkedin:5000/;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
        add_header         Access-Control-Allow-Origin *;
        if ($request_method = OPTIONS) { return 204; }
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
